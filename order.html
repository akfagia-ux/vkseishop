<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа - Vkesi Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">Vkesi Shop</div>
            <ul class="nav-links">
                <li><a href="index.html">Главная</a></li>
                <li><a href="services.html">Услуги</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero">
        <div class="container">
            <div class="order-container" style="max-width: 600px; margin: 2rem auto; background: rgba(26, 26, 26, 0.95); padding: 2rem; border-radius: 20px; border: 2px solid rgba(100, 100, 255, 0.3);">
                <h1 style="text-align: center; margin-bottom: 2rem;">📝 Оформление заказа</h1>
                
                <div class="order-product" style="background: rgba(59, 130, 246, 0.1); padding: 1.5rem; border-radius: 15px; margin-bottom: 2rem; border: 2px solid rgba(59, 130, 246, 0.3);">
                    <h2 style="margin-bottom: 1rem;">🤖 Скрипт на деморган GTA 5 RP</h2>
                    <p style="opacity: 0.8; margin-bottom: 1rem;">Автоматизация процесса отсидки</p>
                    <div style="font-size: 2rem; font-weight: bold; color: #4ade80;">100 ₽</div>
                </div>

                <form id="orderForm" style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">👤 Имя</label>
                        <input type="text" id="firstName" required placeholder="Введите ваше имя" style="width: 100%; padding: 1rem; border-radius: 10px; border: 2px solid rgba(100, 100, 255, 0.3); background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 1rem;">
                    </div>

                    <div class="form-group">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">👤 Фамилия</label>
                        <input type="text" id="lastName" required placeholder="Введите вашу фамилию" style="width: 100%; padding: 1rem; border-radius: 10px; border: 2px solid rgba(100, 100, 255, 0.3); background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 1rem;">
                    </div>

                    <div class="form-group">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">📧 Email (необязательно)</label>
                        <input type="email" id="email" placeholder="your@email.com" style="width: 100%; padding: 1rem; border-radius: 10px; border: 2px solid rgba(100, 100, 255, 0.3); background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 1rem;">
                    </div>

                    <button type="submit" class="btn-primary" style="width: 100%; padding: 1.2rem; font-size: 1.1rem; margin-top: 1rem;">
                        💳 Перейти к оплате
                    </button>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>Владелец сайта: Елизар Макаров</p>
            <p>Связь: <a href="mailto:rilikov2000@mail.ru">rilikov2000@mail.ru</a></p>
            <p style="margin-top: 1rem; opacity: 0.8;">© 2026 Vkesi Shop. Все права защищены. Спонсор: РКН</p>
        </div>
    </footer>

    <script type="module">
        import { auth, db } from './js/firebase-config.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        let currentUser = null;

        // Проверяем авторизацию
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
        });

        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();

            if (!firstName || !lastName) {
                alert('Пожалуйста, заполните имя и фамилию');
                return;
            }

            try {
                // Создаем заказ в Firebase
                const orderData = {
                    firstName,
                    lastName,
                    email: email || null,
                    productName: 'Скрипт на деморган GTA 5 RP',
                    productId: 'gta_script',
                    amount: 100,
                    status: 'pending',
                    paymentConfirmed: false,
                    completed: false,
                    createdAt: serverTimestamp()
                };

                // Если пользователь авторизован, добавляем его ID
                if (currentUser) {
                    orderData.userId = currentUser.uid;
                }

                const orderRef = await addDoc(collection(db, 'orders'), orderData);

                // Переходим на страницу оплаты
                window.location.href = `payment-telegram.html?orderId=${orderRef.id}`;
            } catch (error) {
                console.error('Ошибка создания заказа:', error);
                alert('Произошла ошибка. Попробуйте еще раз.');
            }
        });
    </script>
</body>
</html>
